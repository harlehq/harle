<script>
// Product data map (expanded to include all products from mirror compact page)
const productData = {
  'mirror-compact': {
    name: 'Mirror Compact',
    price: '$39',
    image: 'images/polkadots.jpg',
    link: 'mirror_compact_page.html'
  },
  'mirror-compact-test': {
    name: 'Mirror Compact Test',
    price: '$39',
    image: 'images/leopard.jpg',
    link: 'mirror_compact.html'
  },
  'Vanity Bag Test': {
    name: 'Vanity Bag Test',
    price: '$45',
    image: 'images/military_print.jpg',
    link: 'vanity_bag.html'
  },
  'product-4': {
    name: 'Product 4',
    price: '$66',
    image: 'images/queenofspades.jpg',
    link: 'vanity_bag.html'
  },
  'product-five': {
    name: 'product 5',
    price: '$22',
    image: 'images/lipstick.jpg',
    link: 'lipstick.html'
  }
  // Add more products here if you have them on other pages
};
document.documentElement.lang = navigator.language || navigator.userLanguage || 'en';
// Search auto-suggest functionality
const searchInput = document.querySelector('.search-input');
const suggestions = document.querySelector('.suggestions ul');
const searchWrapper = document.querySelector('.search-wrapper'); // Added: Missing definition
const searchForm = document.querySelector('.right-icons form');
const products = [
  'eyeshadow',
  'eyeliner',
  'mascara',
  'brows',
  'lipstick',
  'gloss',
  'foundation',
  'blush',
  'mirror compact',
  'vanity bag',
  'shop all',
  'new arrivals',
  'best sellers',
  'paintstick',
  // Add more products as needed
];
searchInput.addEventListener('input', () => {
  const value = searchInput.value.trim().toLowerCase();
  suggestions.innerHTML = '';
  if (value) {
    const filtered = products.filter(product => product.toLowerCase().includes(value));
    filtered.forEach(product => {
      const li = document.createElement('li');
      li.textContent = product;
      li.addEventListener('click', () => {
        searchInput.value = product;
        suggestions.parentElement.style.display = 'none';
        searchForm.submit(); // Optionally submit on click
      });
      suggestions.appendChild(li);
    });
    suggestions.parentElement.style.display = filtered.length ? 'block' : 'none';
  } else {
    suggestions.parentElement.style.display = 'none';
  }
});
// Hide suggestions on outside click
document.addEventListener('click', (event) => {
  if (!searchWrapper.contains(event.target)) {
    suggestions.parentElement.style.display = 'none';
  }
});


// Shopping Bag Functionality
function addToShoppingBag(element) {
    const productCard = element.closest('.product-card');
    const productId = productCard.getAttribute('data-product-id');
    let cart = JSON.parse(localStorage.getItem('shoppingBagItems')) || [];
    const index = cart.indexOf(productId);
    if (index === -1) {
        // Not in cart: add it
        cart.push(productId);
    } else {
        // In cart: remove it
        cart.splice(index, 1);
    }
    localStorage.setItem('shoppingBagItems', JSON.stringify(cart));
    updateShoppingBagBadge();
    // Optional: showPopup(); or add a custom message for add/remove
  }
function updateShoppingBagBadge() {
  const cart = JSON.parse(localStorage.getItem('shoppingBagItems')) || [];
  const badge = document.getElementById('shopping_bag-badge');
  if (badge) {
    badge.textContent = cart.length;
    badge.style.display = cart.length > 0 ? 'block' : 'none';
  }
}
// JavaScript for starring functionality using localStorage
function toggleStar(element, productId) {
  let starred = JSON.parse(localStorage.getItem('starredProducts')) || [];
  if (starred.includes(productId)) {
    starred = starred.filter(id => id !== productId);
    element.textContent = '☆';
    element.classList.remove('filled');
  } else {
    starred.push(productId);
    element.textContent = '★';
    element.classList.add('filled');
  }
  localStorage.setItem('starredProducts', JSON.stringify(starred));
  const globalStar = document.querySelector('.navbar .star-icon');
  if (globalStar) globalStar.textContent = (starred.length > 0) ? '★' : '☆';
}
// Function to render starred products
function renderStarredProducts() {
  const starred = JSON.parse(localStorage.getItem('starredProducts')) || [];
  const grid = document.getElementById('starred-grid');
  const emptyMessage = document.getElementById('empty-message');
  grid.innerHTML = ''; // Clear existing content
  if (starred.length === 0) {
    if (emptyMessage) emptyMessage.style.display = 'block';
  } else {
    if (emptyMessage) emptyMessage.style.display = 'none';
    starred.forEach(productId => {
      const data = productData[productId];
      if (data) {
        const card = document.createElement('div');
        card.className = 'product-card';
        card.setAttribute('data-product-id', productId);
        card.innerHTML = `
          <div class="product-content">
            <a href="${data.link}">
              <img src="${data.image}" alt="${data.name}" style="width: 89%; height: auto; margin: 30px; margin-bottom: 0%;">
            </a>
            <div class="product-info">
              <p class="product-name">${data.name}</p>
              <p class="product-price">${data.price}</p>
            </div>
          </div>
          <div class="product-icons">
            <a href="#" class="star-icon filled">★</a>
            <a href="#" class="shopping_bag-icon" onclick="addToShoppingBag(this)">
              <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="currentColor" class="bi bi-bag" viewBox="0 0 16 16">
                <path d="M8 1a2.5 2.5 0 0 1 2.5 2.5V4h-5v-.5A2.5 2.5 0 0 1 8 1m3.5 3v-.5a3.5 3.5 0 1 0-7 0V4H1v10a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V4zM2 5h12v9a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1z"/>
              </svg>
            </a>
          </div>
        `;
      grid.appendChild(card);
// Add event listener for un-starring
card.querySelector('.star-icon').addEventListener('click', function(event) {
event.preventDefault();
toggleStar(this, productId);
renderStarredProducts(); // Re-render after change
        });
      }
    });
  }
updateShoppingBagBadge(); // Added: Ensure badge updates after render
// Update global star icon on render (for consistency on load/changes)
const globalStar = document.querySelector('.navbar .star-icon');
if (globalStar) globalStar.textContent = (starred.length > 0) ? '★' : '☆';
}
// Call on page load
renderStarredProducts();

</script>
