<script>
// Define search-related variables (fixes undefined errors)
const searchInput = document.querySelector('.search-input');
const suggestions = document.querySelector('.suggestions ul');
const searchWrapper = document.querySelector('.search-wrapper');
const searchForm = document.querySelector('form[action="/search"]');
const products = ['Mirror Compact', 'Accessories', 'blusher', 'bronzer', 'brows', 'cheeky', 'conclear', 'contour', 'eyeliner', 'eyes', 'eyeshadow', 'face', 'foundation', 'gloss', 'hair bobs', 'highligher', 'lip liner', 'lips', 'lipstick', 'mascara', 'mirror compact', 'new arrivals', 'oil balm', 'paintsticks', ' powder', 'tools', 'vanity bag']; // Add your product list here, e.g., ['Mirror Compact', 'Lipstick'];
// JavaScript for starring functionality using localStorage
function toggleStar(element, productId) {
let starred = JSON.parse(localStorage.getItem('starredProducts')) || [];
if (starred.includes(productId)) {
starred = starred.filter(id => id !== productId);
element.textContent = '☆';
element.classList.remove('filled');
    } else {
starred.push(productId);
element.textContent = '★';
element.classList.add('filled');
    }
localStorage.setItem('starredProducts', JSON.stringify(starred));
const globalStar = document.querySelector('.navbar .star-icon');
if (globalStar) globalStar.textContent = (starred.length > 0) ? '★' : '☆';
}
// On page load, restore starred states and update badge
window.addEventListener('load', function() {
let starred = JSON.parse(localStorage.getItem('starredProducts')) || [];
document.querySelectorAll('.product-card .star-icon').forEach(function(element) {
let productId = element.closest('.product-card').getAttribute('data-product-id');
if (starred.includes(productId)) {
element.textContent = '★';
element.classList.add('filled');
        }
    });
const globalStar = document.querySelector('.navbar .star-icon');
if (globalStar) globalStar.textContent = (starred.length > 0) ? '★' : '☆';

// Convert old cart format if necessary
let shoppingBag = JSON.parse(localStorage.getItem('shoppingBagItems')) || [];
if (shoppingBag.length > 0 && typeof shoppingBag[0] === 'string') {
    const newShoppingBag = [];
    shoppingBag.forEach(productId => {
        const productCard = document.querySelector(`[data-product-id="${productId}"]`);
        if (productCard) {
            const name = productCard.querySelector('.product-name').textContent;
            const priceStr = productCard.querySelector('.product-price').textContent;
            const price = parseFloat(priceStr.replace('$', ''));
            const image = productCard.querySelector('img').src;
            newShoppingBag.push({id: productId, name, price, image, quantity: 1});
        }
    });
    localStorage.setItem('shoppingBagItems', JSON.stringify(newShoppingBag));
    shoppingBag = newShoppingBag;
}

updateShoppingBagBadge(); // Initialize badge on load
populateShoppingBag(); // Populate shopping bag on load if open
});
if (searchInput) {
searchInput.addEventListener('input', () => {
const value = searchInput.value.trim().toLowerCase();
suggestions.innerHTML = '';
if (value) {
const filtered = products.filter(product => product.toLowerCase().includes(value));
filtered.forEach(product => {
const li = document.createElement('li');
li.textContent = product;
li.addEventListener('click', () => {
searchInput.value = product;
suggestions.parentElement.style.display = 'none';
if (searchForm) searchForm.submit();
                });
suggestions.appendChild(li);
            });
suggestions.parentElement.style.display = filtered.length ? 'block' : 'none';
        } else {
suggestions.parentElement.style.display = 'none';
        }
    });
}
// Hide suggestions on outside click
document.addEventListener('click', (event) => {
if (!searchWrapper.contains(event.target)) {
suggestions.parentElement.style.display = 'none';
    }
});

// Shopping Bag Functionality - Enhanced for quantities and details
function addToShoppingBag(event, element) {
    event.preventDefault();
    const productCard = element.closest('.product-card');
    const productId = productCard.getAttribute('data-product-id');
    const name = productCard.querySelector('.product-name').textContent;
    const priceStr = productCard.querySelector('.product-price').textContent;
    const price = parseFloat(priceStr.replace('$', ''));
    const image = productCard.querySelector('img').src;

    let shoppingBag = JSON.parse(localStorage.getItem('shoppingBagItems')) || [];
    const existingIndex = shoppingBag.findIndex(item => item.id === productId);

    if (existingIndex === -1) {
        // Add new item with quantity 1
        shoppingBag.push({id: productId, name, price, image, quantity: 1});
    } else {
        // Increment quantity
        shoppingBag[existingIndex].quantity += 1;
    }

    localStorage.setItem('shoppingBagItems', JSON.stringify(shoppingBag));
    updateShoppingBagBadge();
    openShoppingBag(); // Open sidebar on add
}

// Update badge with total items count
function updateShoppingBagBadge() {
    const shoppingBag = JSON.parse(localStorage.getItem('shoppingBagItems')) || [];
    const totalItems = shoppingBag.reduce((sum, item) => sum + item.quantity, 0);
    const badge = document.getElementById('shopping_bag-badge');
    if (badge) {
        badge.textContent = totalItems;
        badge.style.display = totalItems > 0 ? 'block' : 'none';
    }
    document.getElementById('shoppingBagCount').textContent = totalItems;
    updateTotals();
}

// Star click handler - improved
document.querySelectorAll('.product-card .star-icon').forEach(function(element) {
    element.addEventListener('click', function(event) {
        event.preventDefault();   // Prevent link from triggering
        const productId = element.closest('.product-card').getAttribute('data-product-id');
        toggleStar(element, productId);
    });
});

// Shopping Bag Sidebar Functions
function openShoppingBag() {
    document.getElementById('shoppingBagSidebar').classList.add('open');
    document.getElementById('overlay').classList.add('open');
    populateShoppingBag();
}

function closeShoppingBag() {
    document.getElementById('shoppingBagSidebar').classList.remove('open');
    document.getElementById('overlay').classList.remove('open');
}

function populateShoppingBag() {
    const shoppingBagItemsEl = document.getElementById('shoppingBagItems');
    const shoppingBag = JSON.parse(localStorage.getItem('shoppingBagItems')) || [];
    shoppingBagItemsEl.innerHTML = '';

    shoppingBag.forEach((item, index) => {
        const shoppingBagItemEl = document.createElement('div');
        shoppingBagItemEl.className = 'shopping_bag-item';
        shoppingBagItemEl.innerHTML = `
            <img src="${item.image}" alt="${item.name}" class="shopping_bag-item-image">
            <div class="shopping_bag-item-details">
                <h3 class="shopping_bag-item-name">${item.name}</h3>
                <div class="shopping_bag-item-price">$${item.price.toFixed(2)}</div>
                <div class="quantity-controls">
                    <button class="quantity-btn" onclick="updateQuantity(${index}, -1)">-</button>
                    <span class="quantity">${item.quantity}</span>
                    <button class="quantity-btn" onclick="updateQuantity(${index}, 1)">+</button>
                </div>
                <div class="actions">
                    <button class="action-btn">Save for later</button>
                    <button class="action-btn">Edit</button>
                    <button class="action-btn" onclick="deleteItem(${index})">Delete</button>
                </div>
            </div>
        `;
        shoppingBagItemsEl.appendChild(shoppingBagItemEl);
    });

    updateTotals();
}

function updateQuantity(index, delta) {
    let shoppingBag = JSON.parse(localStorage.getItem('shoppingBagItems')) || [];
    if (shoppingBag[index]) {
        shoppingBag[index].quantity += delta;
        if (shoppingBag[index].quantity <= 0) {
            shoppingBag.splice(index, 1); // Remove if quantity reaches 0
        }
        localStorage.setItem('shoppingBagItems', JSON.stringify(shoppingBag));
        updateShoppingBagBadge();
        populateShoppingBag(); // Repopulate to reflect changes
    }
}

function deleteItem(index) {
    let shoppingBag = JSON.parse(localStorage.getItem('shoppingBagItems')) || [];
    shoppingBag.splice(index, 1);
    localStorage.setItem('shoppingBagItems', JSON.stringify(shoppingBag));
    updateShoppingBagBadge();
    populateShoppingBag();
}

function updateTotals() {
    const shoppingBag = JSON.parse(localStorage.getItem('shoppingBagItems')) || [];
    const total = shoppingBag.reduce((sum, item) => sum + (item.price * item.quantity), 0);
    document.getElementById('estimatedTotal').textContent = `$${total.toFixed(2)}`;
}

function checkout() {
    // Redirect to checkout page or handle
    alert('Redirecting to checkout...');
    // window.location.href = 'checkout.html';
}

function viewFullShoppingBag() {
    // Redirect to full shopping bag page
    window.location.href = 'shopping_bag.html';
}
</script>
