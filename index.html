<script>
'use strict'; /*this helps for better debugging*/
document.documentElement.lang = navigator.language || navigator.userLanguage || 'en';
// Object to track state for each container
const containerStates = {
WindowsimgContainer1: { isMinimized: false, isEnlarged: false, originalWidth: '', originalHeight: '' },
WindowsimgContainer2: { isMinimized: false, isEnlarged: false, originalWidth: '', originalHeight: '' }
        };
function toggleMinimize(containerId) {
const container = document.getElementById(containerId);
const state = containerStates[containerId];
if (state.isMinimized) {
container.classList.remove('minimized');
state.isMinimized = false;
            } else {
container.classList.add('minimized');
state.isMinimized = true;
            }
        }
function toggleEnlarge(containerId, maxBtnId) {
const container = document.getElementById(containerId);
const maxBtn = document.getElementById(maxBtnId);
const state = containerStates[containerId];
if (state.isEnlarged) {
container.style.width = state.originalWidth;
container.style.height = state.originalHeight;
container.classList.remove('enlarged');
maxBtn.innerText = '□';
state.isEnlarged = false;
            } else {
state.originalWidth = container.style.width || getComputedStyle(container).width;
state.originalHeight = container.style.height || getComputedStyle(container).height;
container.classList.add('enlarged');
maxBtn.innerText = '🗗';
state.isEnlarged = true;
            }
        }
function closeWindow(containerId) {
document.getElementById(containerId).style.display = 'none'; // Fixed typo from 'containerID' to 'containerId'
        }
// Search auto-suggest functionality
const searchInput = document.querySelector('.search-input');
const suggestions = document.querySelector('.suggestions ul');
const searchForm = document.querySelector('.right-icons form');
const searchwrapper = document.querySelector('.search-wrapper');
const products = [
'ring',
'rings',
'01 arle ring',
'arle ring',
'arle',
'01',
// Add more products as needed
];
searchInput.addEventListener('input', () => {
const value = searchInput.value.trim().toLowerCase();
suggestions.innerHTML = '';
if (value) {
const filtered = products.filter(product => product.toLowerCase().includes(value));
filtered.forEach(product => {
const li = document.createElement('li');
li.textContent = product;
li.addEventListener('click', () => {
searchInput.value = product;
suggestions.parentElement.style.display = 'none';
searchForm.submit(); // Optionally submit on click
            });
suggestions.appendChild(li);
        });
suggestions.parentElement.style.display = filtered.length ? 'block' : 'none';
    } else {
suggestions.parentElement.style.display = 'none';
    }
});
// Hide suggestions on outside click
const searchWrapper = document.querySelector('.search-wrapper');
document.addEventListener('click', (event) => {
if (!searchWrapper.contains(event.target)) {
suggestions.parentElement.style.display = 'none';
    }
});
// Shopping bag icon fill and badge functionality
function updateShoppingBagIcon() {
const cart = JSON.parse(localStorage.getItem('shoppingBagItems')) || [];
const bagIcon = document.querySelector('.shopping_bag-icon');
const badge = document.getElementById('shopping_bag-badge');
if (bagIcon) {
if (cart.length > 0) {
bagIcon.classList.add('filled');
        } else {
bagIcon.classList.remove('filled');
        }
    }
if (badge) {
badge.textContent = cart.length;
badge.style.display = cart.length > 0 ? 'block' : 'none';
    }
}
/*Menu bar section*/
function toggleMenu() {
    var sidebar = document.getElementById("mySidebar");
    var main = document.getElementById("main");
    var currentWidth = parseFloat(getComputedStyle(sidebar).width);  // Gets actual pixel width
    if (currentWidth > 0) {
        closeMenu();
    } else {
        openMenu();
    }
}

function openMenu() {
document.getElementById("mySidebar").style.width = "11%";
document.getElementById("mySidebar").style.border = "1px solid black";
document.getElementById("main").style.marginLeft = "250px";
}
function closeMenu() {
document.getElementById("mySidebar").style.width = "0";
document.getElementById("mySidebar").style.border = "none";
document.getElementById("main").style.marginLeft = "0";
}

// Sidebar Accordion Functionality
document.addEventListener('DOMContentLoaded', function() {
    // Define sections: { headingId, contentId }
    const sections = [
        { heading: 'company-heading', content: 'company-content' },
        { heading: 'boutiques-heading', content: 'boutiques-content' },
        { heading: 'connect-heading', content: 'connect-content' },
        { heading: 'services-heading', content: 'services-content' },
        { heading: 'shop-heading', content: 'shop-content' },
        { heading: 'account-heading', content: 'account-content' }
        
        // Add 'alidor-heading' if you want it toggleable: { heading: 'alidor-heading', content: 'alidor-content' }
    ];

    sections.forEach(section => {
        const heading = document.getElementById(section.heading);
        const content = document.getElementById(section.content);
        const icon = heading.querySelector('.toggle-icon');

        if (heading && content && icon) {
            heading.addEventListener('click', function() {
                const isVisible = content.style.display === 'block';
                if (isVisible) {
                    content.style.display = 'none';
                    icon.textContent = '+';
                    icon.classList.remove('rotated');
                } else {
                    content.style.display = 'block';
                    icon.textContent = '✝'; // Cross when expanded (use Unicode or replace with SVG)
                    icon.classList.add('rotated');
                }
            });
        }
    });
});
