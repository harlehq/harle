<script>
'use strict';
document.documentElement.lang = navigator.language || navigator.userLanguage || 'en';

const containerStates = {
WindowsimgContainer1: { isMinimized: false, isEnlarged: false, originalWidth: '', originalHeight: '' },
WindowsimgContainer2: { isMinimized: false, isEnlarged: false, originalWidth: '', originalHeight: '' }
};

function toggleMinimize(containerId) {
const container = document.getElementById(containerId);
const state = containerStates[containerId];
if (state.isMinimized) {
container.classList.remove('minimized');
state.isMinimized = false;
} else {
container.classList.add('minimized');
state.isMinimized = true;
}
}

function toggleEnlarge(containerId, maxBtnId) {
const container = document.getElementById(containerId);
const maxBtn = document.getElementById(maxBtnId);
const state = containerStates[containerId];
if (state.isEnlarged) {
container.style.width = state.originalWidth;
container.style.height = state.originalHeight;
container.classList.remove('enlarged');
maxBtn.innerText = '□';
state.isEnlarged = false;
} else {
state.originalWidth = container.style.width || getComputedStyle(container).width;
state.originalHeight = container.style.height || getComputedStyle(container).height;
container.classList.add('enlarged');
maxBtn.innerText = '🗗';
state.isEnlarged = true;
}
}

function closeWindow(containerId) {
document.getElementById(containerId).style.display = 'none';
}

const searchInput = document.querySelector('.search-input');
const suggestions = document.querySelector('.suggestions ul');
const searchForm = document.querySelector('.right-icons form');
const searchwrapper = document.querySelector('.search-wrapper');
const products = [
'ring',
'rings',
'01 arle ring',
'arle ring',
'arle',
'01',
];

searchInput.addEventListener('input', () => {
const value = searchInput.value.trim().toLowerCase();
suggestions.innerHTML = '';
if (value) {
const filtered = products.filter(product => product.toLowerCase().includes(value));
filtered.forEach(product => {
const li = document.createElement('li');
li.textContent = product;
li.addEventListener('click', () => {
searchInput.value = product;
suggestions.parentElement.style.display = 'none';
searchForm.submit();
});
suggestions.appendChild(li);
});
suggestions.parentElement.style.display = filtered.length ? 'block' : 'none';
} else {
suggestions.parentElement.style.display = 'none';
}
});

const searchWrapper = document.querySelector('.search-wrapper');
document.addEventListener('click', (event) => {
if (!searchWrapper.contains(event.target)) {
suggestions.parentElement.style.display = 'none';
}
});

function updateShoppingBagIcon() {
const cart = JSON.parse(localStorage.getItem('shoppingBagItems')) || [];
const bagIcon = document.querySelector('.shopping_bag-icon');
const badge = document.getElementById('shopping_bag-badge');
if (bagIcon) {
if (cart.length > 0) {
bagIcon.classList.add('filled');
} else {
bagIcon.classList.remove('filled');
}
}
if (badge) {
badge.textContent = cart.length;
badge.style.display = cart.length > 0 ? 'block' : 'none';
}
}

// Sticky Note Script
document.addEventListener('DOMContentLoaded', function() {
    const stickyWindow = document.getElementById('stickyWindow');
    const titleBar = document.getElementById('titleBar');
    const minBtn = document.getElementById('minBtn');
    const maxBtn = document.getElementById('maxBtn');
    const closeBtn = document.getElementById('closeBtn');

    let isMinimized = false;
    let isEnlarged = false;
    let originalStyles = {};

    function saveOriginalStyles() {
        originalStyles = {
            width: stickyWindow.style.width || getComputedStyle(stickyWindow).width,
            height: stickyWindow.style.height || getComputedStyle(stickyWindow).height,
            transform: stickyWindow.style.transform
        };
    }

    let isDragging = false;
    let offsetX, offsetY;

    function startDrag(e) {
        if (e.target.tagName === 'BUTTON') return;
        isDragging = true;
        const rect = stickyWindow.getBoundingClientRect();
        const clientX = e.type.includes('touch') ? e.touches[0].clientX : e.clientX;
        const clientY = e.type.includes('touch') ? e.touches[0].clientY : e.clientY;
        offsetX = clientX - rect.left;
        offsetY = clientY - rect.top;
        stickyWindow.style.transform = 'none';
    }

    function drag(e) {
        if (!isDragging) return;
        const clientX = e.type.includes('touch') ? e.touches[0].clientX : e.clientX;
        const clientY = e.type.includes('touch') ? e.touches[0].clientY : e.clientY;
        stickyWindow.style.left = (clientX - offsetX) + 'px';
        stickyWindow.style.top = (clientY - offsetY) + 'px';
    }

    titleBar.addEventListener('mousedown', startDrag);
    document.addEventListener('mousemove', drag);
    document.addEventListener('mouseup', () => isDragging = false);

    titleBar.addEventListener('touchstart', startDrag, { passive: true });
    document.addEventListener('touchmove', drag, { passive: true });
    document.addEventListener('touchend', () => isDragging = false);

    minBtn.addEventListener('click', () => {
        if (isMinimized) {
            stickyWindow.classList.remove('minimized');
            isMinimized = false;
        } else {
            stickyWindow.classList.add('minimized');
            isMinimized = true;
        }
    });

    maxBtn.addEventListener('click', () => {
        if (isEnlarged) {
            stickyWindow.style.width = originalStyles.width;
            stickyWindow.style.height = originalStyles.height;
            stickyWindow.style.transform = originalStyles.transform;
            stickyWindow.classList.remove('enlarged');
            isEnlarged = false;
        } else {
            saveOriginalStyles();
            stickyWindow.classList.add('enlarged');
            isEnlarged = true;
        }
    });

    closeBtn.addEventListener('click', () => {
        stickyWindow.style.display = 'none';
    });

    saveOriginalStyles();
});
</script>
</body>
</html>
